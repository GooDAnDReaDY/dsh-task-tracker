name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install --package-lock-only || true
      - name: Check syntax
        run: node --check lib/index.js lib/client.js lib/routes.js lib/storage.js
      - name: Run tests
        run: npm test
